name: CI

on:
  push:
    branches: [main]
  pull_request:

# Права нужны для публикации книги на GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем предыдущий запуск для той же ветки, если пришёл новый коммит.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go-тренажёр (эталонные решения)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercises
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt (форматирование)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Файлы не отформатированы gofmt:"; echo "$unformatted"
            exit 1
          fi
      - name: go vet (эталоны)
        run: go vet -tags solution ./...
      - name: go test (эталоны)
        run: go test -tags solution -count=1 ./...
      # Детектор гонок на эталонах: важен для конкурентных пакетов (parallelbfs и
      # будущих) — ловит незащищённый доступ к общей памяти из горутин.
      - name: go test -race (эталоны, гонки данных)
        run: go test -tags solution -race -count=1 ./...
      # Бенчмарки должны компилироваться и отрабатывать (по 1 итерации) на эталоне —
      # чтобы они не «протухли» при правке сигнатур. Сами замеры — локально без -benchtime=1x.
      - name: go test -bench (бенчмарки запускаются)
        run: go test -tags solution -run='^$' -bench=. -benchtime=1x ./...
      # Go-листинги книги (src/*.md) — валидный Go, а не «текст, похожий на код».
      # Проверяется РАЗБОР, а не компиляция: листинг намеренно не самодостаточен
      # (показан метод, а не весь тип), поэтому типизация давала бы сотни ложных
      # «undefined». Псевдокод помечается <!-- snippet:pseudo --> перед ```go.
      - name: Листинги книги разбираются как Go
        run: go run ./cmd/checksnippets -src ../src
      # Банк задач для смешанной тренировки генерируется из док-комментариев
      # заготовок: закоммиченный assets/problems.js обязан совпадать с исходниками.
      - name: Банк задач актуален
        run: go run ./cmd/problembank -check
      # Заготовки должны КОМПИЛИРОВАТЬСЯ без тега solution: ловит рассинхрон
      # сигнатур между заготовкой, эталоном и тестом (тест — общая спецификация).
      - name: go vet (заготовки компилируются)
        run: go vet ./...
      # Заготовки НЕ должны проходить тесты без тега solution: если какой-то
      # пакет зелёный на untagged-сборке — значит решение случайно попало в
      # файл-заготовку вместо panic("TODO"). Проверка касается только пакетов
      # с РЕАЛЬНОЙ парой заготовка/эталон (<pkg>/<pkg>_solution.go существует)
      # — у пакетов без неё просто нечему "протечь": это либо инфраструктура
      # (cmd/runner и его helper'ы вроде traceinstr — обычный код, не задача с
      # решением), либо капстоун miniredis на этапе, где solution ещё не
      # заведён (см. src/miniredis.md) — эта проверка сама начнёт его
      # контролировать, как только появится miniredis_solution.go.
      - name: Заготовки ещё не решены
        run: |
          fail=0
          for pkg in $(go list ./...); do
            dir=$(go list -f '{{.Dir}}' "$pkg")
            base=$(basename "$dir")
            if [ ! -f "$dir/${base}_solution.go" ]; then
              continue
            fi
            if out=$(go test -count=1 "$pkg" 2>&1); then
              if ! echo "$out" | grep -q "no test files"; then
                echo "::error::Пакет $pkg проходит тесты БЕЗ -tags solution — решение попало в заготовку"
                fail=1
              fi
            fi
          done
          exit $fail

  assets-check:
    name: Интерактив (JS-визуализации)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Синтаксис каждого ассета (mdBook просто копирует JS — сам он не валидируется).
      - name: node --check (синтаксис JS)
        run: for f in assets/*.js; do node --check "$f"; done
      # Согласованность: каждый data-viz из глав имеет конфиг DASH, codeKey есть в CODE,
      # индексы lineNotes в пределах листинга. Ловит «молчаливый пустой виджет».
      - name: Смоук визуализаций
        run: node scripts/check-viz.js
      # Линт слоя задач: у choice ≥ 3 вариантов, ответы в диапазоне, explain на месте,
      # нет «|» внутри вариантов (режется движком). Ловит контентные ошибки виджетов.
      - name: Линт интерактивных задач
        run: node scripts/check-challenges.js
      # Режим «объясни сам»: вопрос без эталона или ключ от чужой главы дают
      # пустую рамку и карточку повторения, ведущую не туда.
      - name: Линт режима «объясни сам»
        run: node scripts/check-explain.js
      # Рантайм-смоук: каждый тип виджета реально строится в jsdom с атрибутами из глав
      # и прошагивается — единственная защита от крэшей/пустого рендера при регрессиях.
      - name: Рендер-смоук визуализаций (jsdom)
        run: |
          npm install --no-save jsdom
          node scripts/viz-render-check.js
      # Инфраструктурные виджеты: хук register, генератор страницы Postgres
      # (числа сняты с живого Postgres 16 через pageinspect), инварианты на фуззе.
      - name: Смоук infra-viz (jsdom + генераторы)
        run: node scripts/infra-viz-check.js
      # mdBook листает главы по ←/→ на document и не смотрит defaultPrevented:
      # клавиша, обработанная виджетом, обязана остановиться в нём, иначе шаг
      # виджета заодно уводит на соседнюю главу.
      - name: Смоук клавиш виджетов (jsdom)
        run: node scripts/keys-check.js
      # Чипы и плашки называются как переменные листинга: читатель сверяет холст с
      # кодом по именам. Известные расхождения — в scripts/viz-names-allow.json, и
      # список обязан только сокращаться (новое нарушение и мёртвая запись роняют шаг).
      - name: Имена на холсте = имена в коде (jsdom)
        run: node scripts/check-viz-names.js
      # Режим 🎯: на развилке «›» ждёт ответа, ответ сверяется со следующим шагом,
      # промах уходит в повторения, автопроигрывание встаёт на вопросе.
      - name: Смоук режима «Предсказывать» (jsdom)
        run: node scripts/predict-check.js
      # Поведение движка задач: шаффл choice, «не спойлерить разбор при промахе»,
      # нормализация ввода (кириллическая О, пробелы в числах).
      - name: Смоук движка задач (jsdom)
        run: node scripts/challenge-engine-check.js
      # Трекер прогресса: его содержимое зашито в JS (нет data-атрибутов в главе),
      # поэтому check-viz.js его не видит — поведение проверяется отдельно.
      - name: Смоук трекера прогресса (jsdom)
        run: node scripts/progress-render-check.js
      # Сквозной сценарий «промах в главе -> список повторить -> экспорт/импорт»:
      # ломается обычно стык между виджетами, а не они сами.
      - name: Смоук повторения промахов и переноса прогресса (jsdom)
        run: node scripts/review-render-check.js
      # Движок интервальных повторений: проверяется арифметика расписания
      # (интервалы, ease, сроки новых карточек), а не факт отрисовки.
      - name: Смоук интервальных повторений (jsdom)
        run: node scripts/srs-check.js
      # Ручные реестры (трекер прогресса, таблица пакетов, traceTargets, счётчик
      # в CLAUDE.md) должны совпадать с реальным составом книги и тренажёра.
      # Расхождение здесь не ломает сборку — оно тихо ухудшает книгу.
      - name: Сверка реестров с реальностью
        run: node scripts/check-registries.js
      # Лестница задач: у главы ядра со списком задач должны быть три ступени по
      # порядку и подсказка «не пошло». Новая глава ядра иначе тихо приедет с
      # плоским списком ссылок, и маршрут снова станет «прорешай всё подряд».
      - name: Линт лестницы задач
        run: node scripts/check-ladder.js

  build-book:
    name: Сборка mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: peaceiris/actions-mdbook@v2
        with:
          # Запинено для воспроизводимости (совпадает с локальной сборкой). Если CI не
          # найдёт версию — поднять до доступной в action / вернуть 'latest'.
          mdbook-version: '0.5.2'
      - run: mdbook build
      # Целостность внутренних ссылок/якорей по собранному book/ (битая ссылка иначе
      # всплывёт только у читателя кликом).
      - name: Проверка внутренних ссылок
        run: node scripts/check-links.js
      # Поведение режима «объясни сам» проверяется на СОБРАННОЙ странице: разметка
      # вопросов и эталонов живёт в src/*.md и проходит через mdBook.
      - name: Смоук режима «объясни сам» (jsdom)
        run: |
          npm install --no-save jsdom
          node scripts/explain-check.js
      # Смешанная тренировка и диагностика слабых мест: главное здесь — что до
      # ответа НЕ видно ни темы, ни пакета, ни подсказок из условия.
      - name: Смоук смешанной тренировки (jsdom)
        run: node scripts/mixed-check.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: Публикация на GitHub Pages
    needs: [go-tests, assets-check, build-book]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

[book]
title = "Алгоритмические шаблоны для решения задач на собеседованиях"
description = "Подробное изучение 25 основных алгоритмических шаблонов с примерами на Go"
authors = ["Algorithm Study Guide"]
language = "ru"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = ""
edit-url-template = ""
git-repository-icon = "fa-github"
mathjax-support = true
additional-css = ["assets/algo-viz.css", "assets/quiz.css"]
additional-js = ["assets/algo-viz.js", "assets/quiz.js", "assets/progress.js"]
no-section-label = false
# runnable = false: mdBook Playground выполняет только Rust; код на Go запускается локально (go run/go test)
playground = { editable = true, copyable = true, copy-js = true, line-numbers = false, runnable = false }
search = { enable = true, limit-results = 30, teaser-word-count = 30, use-boolean-and = true, boost-title = 2, boost-hierarchy = 1, boost-paragraph = 1, expand = true, heading-split-level = 3 }

[preprocessor.links]

[preprocessor.index]

[book]
title = "Алгоритмы и структуры данных: от фундамента к синтезу"
description = "Учебник-тренажёр по алгоритмам и структурам данных для инженера на Go: 60+ глав с доказательствами корректности и ценой на практике, пошаговые визуализации, 700+ задач в тексте и Go-тренажёр на 70+ пакетов"
authors = ["Idel Fazletdinov"]
language = "ru"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
# Тема одна: navy, перекрашенная в assets/theme.css; theme/head.hbs не даёт сохранённому выбору её сменить.
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/fazletdinov/algorithms-book"
edit-url-template = "https://github.com/fazletdinov/algorithms-book/edit/main/{path}"
git-repository-icon = "fab-github"  # с mdBook 0.5 нужен префикс типа: fab (brands), а не голое fa-github
mathjax-support = true
additional-css = ["assets/algo-viz.css", "assets/quiz.css", "assets/challenge.css", "assets/runner.css", "assets/trace-viz.css", "assets/infra-viz.css", "assets/theme.css"]
additional-js = ["assets/algo-viz.js", "assets/infra-core.js", "assets/infra-pg.js", "assets/infra-redis.js", "assets/quiz.js", "assets/progress.js", "assets/challenge.js", "assets/runner.js", "assets/trace-viz.js", "assets/review.js", "assets/takeaways.js", "assets/srs.js", "assets/explain.js", "assets/problems.js", "assets/mixed.js"]
no-section-label = false
# runnable = false: mdBook Playground выполняет только Rust; код на Go запускается локально (go run/go test)
playground = { editable = true, copyable = true, copy-js = true, line-numbers = false, runnable = false }
search = { enable = true, limit-results = 30, teaser-word-count = 30, use-boolean-and = true, boost-title = 2, boost-hierarchy = 1, boost-paragraph = 1, expand = true, heading-split-level = 3 }

[preprocessor.links]

[preprocessor.index]
